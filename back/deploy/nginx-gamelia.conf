# Gamelia : un seul nom de domaine pour le site et l'API.
#   https://DOMAINE/        -> site Next.js   (127.0.0.1:3000)
#   https://DOMAINE/api/... -> API Express    (127.0.0.1:4000), le préfixe /api est retiré
# Même origine pour le site et l'API : les cookies de session et le jeton CSRF fonctionnent sans réglage de domaine.
# Remplacer DOMAINE (le script installer-vps.sh le fait), puis lancer certbot, qui ajoute le HTTPS (port 443).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    client_max_body_size 1m;          # même limite que l'API (photo de profil comprise)
    server_tokens off;

    # Une fois le HTTPS en place, le navigateur n'utilise plus jamais le HTTP pour ce domaine.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Optimisation d'images de Next.js : inutilisée par le site, donc fermée (réduit la surface d'attaque).
    location /_next/image {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/;   # la barre finale retire le préfixe /api
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # adresse du visiteur, non falsifiable par un en-tête
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;              # Agnès peut mettre jusqu'à 60 s à répondre (AGNES_TIMEOUT_MS)
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
